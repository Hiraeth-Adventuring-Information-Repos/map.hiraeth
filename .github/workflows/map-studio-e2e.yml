name: Map Studio Browser Workflow

on:
  pull_request:
    paths:
      - map-studio.html
      - map-editor.html
      - css/map-studio.css
      - css/map-editor.css
      - js/map-studio.js
      - js/map-studio-model.js
      - js/map-editor.js
      - js/map-editor-fields.js
      - js/map-editor-history.js
      - js/editor-shared.js
      - scripts/editor_server.js
      - scripts/map_studio_*.js
      - tests/map-studio-workflow.spec.mjs
      - tests/fixtures/map-studio-e2e-fixture.cjs
      - playwright.config.mjs
      - package.json
      - package-lock.json
      - .github/workflows/map-studio-e2e.yml
  workflow_dispatch:

jobs:
  workflow:
    name: Draft to recovered publication
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install image tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends imagemagick webp

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Exercise the maintainer workflow
        run: npm run test:studio:e2e

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: map-studio-playwright-report
          path: |
            playwright-report
            test-results
