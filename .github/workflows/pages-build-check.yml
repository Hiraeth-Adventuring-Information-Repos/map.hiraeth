name: Pages Build Check

on:
  push:
    branches:
      - pages-static-publish
    paths-ignore:
      - dist/**
      - readme.md
      - .gitignore
  pull_request:
    paths-ignore:
      - dist/**
      - readme.md
      - .gitignore

jobs:
  validate-pages-bundle:
    name: Validate static Pages bundle
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate atlas index
        run: npm run generate:atlas

      - name: Calculate tile cache key
        id: tile-key
        run: echo "key=$(node scripts/generate_tiles.js --print-cache-key)" >> "$GITHUB_OUTPUT"

      - name: Restore generated map tiles
        id: tile-cache
        uses: actions/cache@v6
        with:
          path: .cache/pages-tiles
          key: pages-tiles-${{ runner.os }}-${{ steps.tile-key.outputs.key }}
          restore-keys: |
            pages-tiles-${{ runner.os }}-

      - name: Install tile generation tools
        if: steps.tile-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends imagemagick webp

      - name: Validate data and tests
        run: npm run validate:data && npm run test:unit

      - name: Build Pages bundle
        env:
          MAP_HIRAETH_TILE_CACHE_DIR: .cache/pages-tiles
        run: npm run build:pages

      - name: Install Firefox test browser
        run: npx playwright install --with-deps firefox

      - name: Verify Firefox map rendering
        run: npm run test:firefox

      - name: Upload Pages bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: pages-static-bundle
          path: dist

      - name: Summarize Pages bundle
        env:
          PAGES_SUMMARY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/pages_pr_summary.js >> "$GITHUB_STEP_SUMMARY"
