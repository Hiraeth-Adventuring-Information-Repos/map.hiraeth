name: Viewer Browser Workflow

on:
  pull_request:
  workflow_dispatch:

jobs:
  workflow:
    name: Viewer browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install image tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends imagemagick webp

      - name: Install Chromium and Firefox
        run: npx playwright install --with-deps chromium firefox

      - name: Exercise viewer workflows
        run: npx playwright test

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: viewer-playwright-report
          path: |
            playwright-report
            test-results
